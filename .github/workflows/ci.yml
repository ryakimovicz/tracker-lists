name: Pathd CI / Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Check & Vite Production Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Tests & Migration Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_ci.db
      SECRET_KEY: test_secret_key_for_continuous_integration_environment_only
      ENVIRONMENT: test
      PROJECT_NAME: Pathd
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest -v

      - name: Validate Alembic Migrations
        run: |
          alembic upgrade head
          alembic current
