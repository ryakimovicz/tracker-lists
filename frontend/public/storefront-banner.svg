<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" fill="none">
  <!-- Fondo Cinema Charcoal Oficial de Pathd (#090d16) -->
  <rect width="1200" height="400" fill="#090d16" />

  <!-- Auras y Resplandores Sutiles de Fondo -->
  <circle cx="200" cy="200" r="300" fill="#f59e0b" opacity="0.06" />
  <circle cx="1000" cy="200" r="300" fill="#2563eb" opacity="0.04" />

  <!-- Contenedor Centrado: Isotipo + Tipografía Pathd -->
  <g transform="translate(360, 110)">
    <!-- Isotipo P Proporcionado -->
    <g transform="translate(0, 10)">
      <rect x="24" y="24" width="28" height="132" rx="14" fill="#f59e0b" />
      <rect x="64" y="24" width="75" height="28" rx="14" fill="#4ade80" />
      <rect x="64" y="60" width="98" height="28" rx="14" fill="#60a5fa" />
      <rect x="64" y="96" width="63" height="28" rx="14" fill="#c084fc" />
    </g>

    <!-- Tipografía Pathd + Tagline -->
    <text x="210" y="110" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#f8fafc">
      Path<tspan fill="#f59e0b">d</tspan>
    </text>
    <text x="212" y="152" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#94a3b8">
      MEDIA TRACKER &amp; GUIDES
    </text>
  </g>
</svg>
