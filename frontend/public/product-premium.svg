<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Fondo Squircle Dark Charcoal con Borde Ámbar -->
  <rect width="512" height="512" rx="112" fill="#090d16" stroke="rgba(245, 158, 11, 0.4)" stroke-width="4" />

  <!-- Resplandor Dorado Radial de Fondo -->
  <radialGradient id="goldGlow" cx="50%" cy="45%" r="45%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
  </radialGradient>
  <circle cx="256" cy="230" r="200" fill="url(#goldGlow)" />

  <!-- Corona Dorada Premium Estilizada (Geometría Lucide Crown Mejorada) -->
  <g transform="translate(136, 110)">
    <!-- Aura de la Corona -->
    <path d="M24 168L0 44L72 96L120 16L168 96L240 44L216 168H24Z" 
          fill="url(#goldGradient)" 
          stroke="#fbbf24" 
          stroke-width="8" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- Círculos / Gemas de las puntas -->
    <circle cx="0" cy="44" r="10" fill="#fef08a" stroke="#f59e0b" stroke-width="4" />
    <circle cx="72" cy="96" r="10" fill="#fef08a" stroke="#f59e0b" stroke-width="4" />
    <circle cx="120" cy="16" r="12" fill="#fff" stroke="#f59e0b" stroke-width="4" />
    <circle cx="168" cy="96" r="10" fill="#fef08a" stroke="#f59e0b" stroke-width="4" />
    <circle cx="240" cy="44" r="10" fill="#fef08a" stroke="#f59e0b" stroke-width="4" />

    <!-- Banda Inferior de la Corona -->
    <rect x="24" y="152" width="192" height="24" rx="8" fill="#d97706" />
    <circle cx="64" cy="164" r="5" fill="#fef08a" />
    <circle cx="120" cy="164" r="6" fill="#fff" />
    <circle cx="176" cy="164" r="5" fill="#fef08a" />
  </g>

  <!-- Gradiente Dorado Oficial -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="240" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Tipografía Oficial: PATHD PREMIUM -->
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="1" fill="#f8fafc">
    Path<tspan fill="#f59e0b">d</tspan>
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#fbbf24">
    PREMIUM
  </text>
</svg>
