<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Fondo Dark Charcoal -->
  <rect width="500" height="500" rx="54" fill="#090d16" />

  <!-- Isotipo P Proporcionado -->
  <g transform="translate(160, 44)">
    <!-- Tallo: Ámbar Solar -->
    <rect x="0" y="0" width="34" height="206" rx="17" fill="#f59e0b" />
    <!-- Barra Superior: Películas -->
    <rect x="48" y="0" width="98" height="34" rx="17" fill="#4ade80" />
    <!-- Barra Media: Manga / Lectura -->
    <rect x="48" y="48" width="132" height="34" rx="17" fill="#60a5fa" />
    <!-- Barra Inferior: Videojuegos -->
    <rect x="48" y="96" width="84" height="34" rx="17" fill="#c084fc" />
  </g>

  <!-- Tipografía Pathd Centrada -->
  <text x="250" y="372" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="94" font-weight="800" letter-spacing="-2" fill="#f8fafc">
    Path<tspan fill="#f59e0b">d</tspan>
  </text>
  <text x="250" y="424" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#94a3b8">
    MEDIA TRACKER &amp; GUIDES
  </text>
</svg>
